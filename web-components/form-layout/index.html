<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
</head>


<section id="contact">
  <h2>お問い合わせ</h2>
  <p class="center-text">私たちと一緒に活動してみたい方、興味のある方、こんな活動を取り上げてほしいなど、なんでもお気軽にお問い合わせください。</p>

  <form class="contact-form">
    <div class="form-group">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" placeholder="大宮 二郎" required>
    </div>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>
    </div>

    <div class="form-group">
        <label>お問い合わせの種類（複数選択OK！）</label>
    <div class="checkbox-group">
        <label class="checkbox-item">
        <input type="checkbox" name="type" value="member"> 一緒に活動してみたい
        </label>
        <label class="checkbox-item">
      <input type="checkbox" name="type" value="interest"> 活動に興味がある
        </label>
        <label class="checkbox-item">
      <input type="checkbox" name="type" value="idea"> 活動のアイデア・提案がある
        </label>
        <label class="checkbox-item">
      <input type="checkbox" name="type" value="report"> 地元の活動を取り上げてほしい
        </label>
        <label class="checkbox-item">
      <input type="checkbox" name="type" value="other"> その他
        </label>
    </div>
    </div>

    <div class="form-group">
      <label for="message">メッセージ</label>
      <textarea id="message" name="message" rows="5" placeholder="自由にご記入ください！"></textarea>
    </div>

    <button type="submit" class="submit-btn">ASOBI-Xに声を届ける</button>
  </form>
</section>
