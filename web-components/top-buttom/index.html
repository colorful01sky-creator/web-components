<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
</head>


<!---フッターの下に入れる--->
  <button id="toTop">↑</button>

<!---ジャバスクリプト部分--->
  <script>

  // スクロール量に応じて「TOPへ戻る」ボタンを表示
  window.addEventListener("scroll", () => {
  toTop.style.display = window.scrollY > 300 ? "block" : "none";
});

  // スムーススクロールでTOPへ
  toTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
  </script>
