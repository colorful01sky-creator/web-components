<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
</head>

<header>
  <h1>街づくりラボ &nbsp; ASOBI-X</h1>

  <!-- メニューを閉じる -->
  <nav class="nav">
    <button class="nav-close" aria-label="メニューを閉じる"></button>
  <!-- liはnavを挿入 -->
        <ul>
            <li><a href="#about">ASOBI-Xとは</a></li>
            <li><a href="#activity">活動内容</a></li>
            <li><a href="#news">お知らせ</a></li>
            <li><a href="#contact">お問い合わせ</a></li>
        </ul>
    </nav>
<!-- これは通常のnavの仕様 -->
    <nav>
        <ul id="navMenu">
            <li><a href="#about">ASOBI-Xとは</a></li>
            <li><a href="#activity">活動内容</a></li>
            <li><a href="#news">お知らせ</a></li>
            <li><a href="#contact">お問い合わせ</a></li>
        </ul>
<!-- navにハンバーガーを置く設定 -->
        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </nav>
</header>

    <!--- JavaScript部分 --->
  <!-- ハンバーガーとTOPへ戻る部分のjavascript -->
  <script>
  const hamburger = document.getElementById("hamburger");
  const navMenu = document.getElementById("navMenu");
  const body = document.body; // bodyを取得

  // ハンバーガーの開閉
  hamburger.addEventListener("click", () => {
  hamburger.classList.toggle("active");
  navMenu.classList.toggle("active");
  body.classList.toggle("menu-open"); // 背景を暗くするクラスを付け外し
  });

  const closeBtn = document.querySelector(".nav-close");

  closeBtn.addEventListener("click", () => {
  hamburger.classList.remove("active");
  navMenu.classList.remove("active");
  body.classList.remove("menu-open");
});

  // リンクをクリックしたら閉じる
  const navLinks = document.querySelectorAll("#navMenu a");
  navLinks.forEach(link => {
  link.addEventListener("click", () => {
  hamburger.classList.remove("active");
  navMenu.classList.remove("active");
  body.classList.remove("menu-open"); // ここでもクラスを外す
  });
});
